# R-hub's generic GitHub Actions workflow file. It's canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# dparser changes (keep them when updating):
#
# * NOT_CRAN=true, so tests/testthat/test-concurrent-dparse.R (skip_on_cran)
#   runs; it is what catches concurrent dparse() bugs (nlmixr2/dparser-R#33).
#
# * After the check, a downstream step installs this checkout's dparser and
#   rxode2 from GitHub and runs .github/rhub/rxode2-parallel-cse.R, rxode2's
#   OpenMP common-subexpression pass, which is where #33 crashed first (in
#   babelmixr2's checks).  Turn it off with the `downstream` input.
#
# For the sanitizer checks, e.g.
#
# rhub::rhub_check(platforms = c("clang-asan", "clang-ubsan"))

name: R-hub
run-name: "${{ github.event.inputs.id }}: ${{ github.event.inputs.name || format('Manually run by {0}', github.triggering_actor) }}"

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'A comma separated list of R-hub platforms to use.'
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Run name. You can leave this empty now.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty now.'
        type: string
      downstream:
        description: 'Also run the rxode2 parallel CSE smoke test (not on Windows).'
        type: string
        default: 'true'

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}
    env:
      NOT_CRAN: true

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - name: Downstream rxode2 parallel CSE (dparser-R#33)
        if: ${{ !cancelled() && github.event.inputs.downstream != 'false' }}
        shell: bash
        run: |
          set -o pipefail
          Rscript -e 'pak::pak(c("local::.", "nlmixr2/rxode2"), upgrade = FALSE, ask = FALSE)'
          Rscript .github/rhub/rxode2-parallel-cse.R 2>&1 | tee downstream.out
          if grep -E 'runtime error|ERROR: AddressSanitizer' downstream.out; then
            echo "::error::sanitizer report in the rxode2 parallel CSE smoke test"
            exit 1
          fi

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}
    env:
      NOT_CRAN: true

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - name: Downstream rxode2 parallel CSE (dparser-R#33)
        if: ${{ !cancelled() && runner.os != 'Windows' && github.event.inputs.downstream != 'false' }}
        shell: bash
        run: |
          set -o pipefail
          Rscript -e 'pak::pak(c("local::.", "nlmixr2/rxode2"), upgrade = FALSE, ask = FALSE)'
          Rscript .github/rhub/rxode2-parallel-cse.R 2>&1 | tee downstream.out
          if grep -E 'runtime error|ERROR: AddressSanitizer' downstream.out; then
            echo "::error::sanitizer report in the rxode2 parallel CSE smoke test"
            exit 1
          fi
